<!doctype html>
<html lang="en" data-theme="light" data-palette="spot">
  <head>
    <meta charset="UTF-8" />
    <title>Hero posters</title>
    <!--
      Renders the hero's still posters: the robot scene's first frame in each
      palette and theme, on a transparent background. Open it through the dev
      server (npm run dev, then /scripts/posters/) and call renderPoster(), or
      let scripts/render-posters.mjs drive it.
    -->
    <style>
      body {
        margin: 0;
      }
      #host {
        width: 1600px;
        height: 1600px;
      }
    </style>
  </head>
  <body>
    <!-- In the hero's lab panel, as on the page (palettes.css). -->
    <div class="hero-lab"><div id="host"></div></div>
    <script type="module">
      import '/src/index.css';
      import { createRobotScene } from '/src/components/hero/scene/createRobotScene.js';
      import { readPalette } from '/src/components/hero/palette.js';

      const webp = (canvas, size) => {
        const out = document.createElement('canvas');
        out.width = size;
        out.height = size;
        const context = out.getContext('2d');
        context.imageSmoothingQuality = 'high';
        context.drawImage(canvas, 0, 0, size, size);
        // 0.75 looks the same as 0.86 here and saves ~15%: the still is the
        // home page's largest paint on phones.
        return out.toDataURL('image/webp', 0.75);
      };

      /** { full, small }: WebP data URLs at 1600 and 800 px for one palette and theme. */
      window.renderPoster = async (palette, theme) => {
        const html = document.documentElement;
        html.dataset.palette = palette;
        html.dataset.theme = theme;
        const host = document.getElementById('host');
        host.replaceChildren();
        const scene = createRobotScene({ host, palette: readPalette(host), poster: true });
        await scene.ready;
        const image = new Image();
        image.src = scene.capture('image/png');
        await image.decode();
        scene.dispose();
        const canvas = document.createElement('canvas');
        canvas.width = image.width;
        canvas.height = image.height;
        canvas.getContext('2d').drawImage(image, 0, 0);
        return { full: webp(canvas, 1600), small: webp(canvas, 800) };
      };
      window.postersReady = true;
    </script>
  </body>
</html>
