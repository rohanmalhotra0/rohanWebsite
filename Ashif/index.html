    <!-- Apply the saved theme before first paint. Light is the default; the toggle saves dark. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('rm-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0e0e0d' : '#f3f2ee');

        // ⌘ or Ctrl in shortcut hints (both are in the markup; CSS picks one).
        var platform =
          (navigator.userAgentData && navigator.userAgentData.platform) ||
          navigator.platform ||
          navigator.userAgent ||
          '';
        if (/mac|iphone|ipad|ipod/i.test(platform)) {
          document.documentElement.classList.add('apple');
        }

        // The prerendered markup in #root is the portfolio; on the résumé
        // route it stays hidden until the app replaces it.
        if (location.hash === '#/resume') {
          document.documentElement.classList.add('route-resume');
        }

        // The hero's robot poster is the largest thing on the first screen;
        // start fetching the right theme's copy before any JS runs.
        if (location.hash !== '#/resume') {
          var poster = document.createElement('link');
          poster.rel = 'preload';
          poster.as = 'image';
          poster.href = 'img/hero/robot-' + theme + '.webp';
          poster.setAttribute('fetchpriority', 'high');
          document.head.appendChild(poster);
        }
      })();
    </script>
